<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Principal - Sistema de Bolis</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }

    .menu-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .btn-menu {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 20px;
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-menu:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.18);
    }

    /* Colores personalizados para cada botón */
    .btn-inventario {
      background-color: #4CAF50; /* Verde */
    }

    .btn-deudores {
      background-color: #2563eb; /* Azul */
    }

    .btn-sabores {
      background-color: #7c3aed; /* Morado */
    }

    .btn-proximamente {
      background-color: #6b7280; /* Gris */
      cursor: not-allowed;
      opacity: 0.7;
    }

    .btn-proximamente:hover {
      transform: none;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>

  <h1>Sistema de Gestión</h1>

  <div class="menu-container">
    <a href="inventario.html" class="btn-menu btn-inventario">
      Inventario
    </a>

    <a href="deudores.html" class="btn-menu btn-deudores">
      Deudores
    </a>

    <a href="registroSabores.html" class="btn-menu btn-sabores">
      Registro de Sabores
    </a>

    <a href="#" class="btn-menu btn-proximamente">
      Próximamente...
    </a>
  </div>

</body>
</html>
