<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Principal - Sistema de Bolis</title>
  <style>
    /* Estilo */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #ffffff; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }

    /* Contenedor del menú principal */
    .menu-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Botones rectangulares grandes */
    .btn-menu {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 20px;
      background: #ffffff;
      color: #333;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border: 1px solid #e0e0e0;
      transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
    }

    .btn-menu:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      background: #f9f9f9;
    }

    /* Estilo para el botón pendiente/deshabilitado temporalmente */
    .btn-menu.disabled {
      color: #aaa;
      border: 1px dashed #ccc;
      cursor: not-allowed;
      box-shadow: none;
      background: #fafafa;
    }

    .btn-menu.disabled:hover {
      transform: none;
      box-shadow: none;
      background: #fafafa;
    }
  </style>
</head>
<body>

  <h1>🍧 Sistema de Gestión</h1>

  <div class="menu-container">
    <a href="inventario.html" class="btn-menu">
      📊 Inventario
    </a>

    <a href="deudores.html" class="btn-menu">
      👤 Deudores
    </a>

    <a href="registro-sabores.html" class="btn-menu">
      🍓 Registro de Sabores
    </a>

    <!-- Botón reservado para la nueva función -->
    <a href="#" class="btn-menu disabled">
      ⚙️ Próximamente...
    </a>
  </div>

</body>
</html>
